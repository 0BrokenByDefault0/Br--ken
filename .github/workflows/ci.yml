name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/BrokenKit

  app:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipa]') || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test
        run: |
          UDID="$(scripts/pick-simulator.sh)"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project Broken.xcodeproj -scheme Broken -destination "id=$UDID" \
            -parallel-testing-enabled NO -default-test-execution-time-allowance 120
      - run: scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Broken.ipa
          path: Broken.ipa
          if-no-files-found: error
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Broken.ipa
